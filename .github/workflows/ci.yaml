name: CI

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Установить uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name:  Установить зависимости
        run: uv sync
      - name: Проверка линтера
        run: uv run ruff check
      - name: Запуск тестов
        run: uv run pytest
        env:
          GREETING: "CI"
          DATABASE_URL: "postgresql://ci:ci@db:5432/ci"
  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Включить эмуляцию для мультиархитектурной сборки
        uses: docker/setup-qemu-action@v3
      - name: Настроить сборщик Docker
        uses: docker/setup-buildx-action@v4
      - name: Вход в реестр GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name:  Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/evgpov/ss:latest
  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/evgpov/ss:${{ github.ref_name }}